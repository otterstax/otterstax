# OtterStax Benchmark Configuration

# Repetitions per sub-test query (can be overridden with --repetitions)
repetitions: 5

# Group A — large databases (mysql1 / pg1 / ch1)
# Used by: simple_select, complex_select, join_same_instance (camp×imp), join_all
group_a:
  num_campaigns: 1000
  impressions_per_campaign: 60   # ~60k impressions total
  stats_per_campaign: 60         # ~60k daily_stats total
  batch_size: 1000

# Group B — small databases (mysql2 / pg2 / ch2)
# Used by: simple_select, complex_select, join_same_instance (prod×ord), join_cross_engine
group_b:
  num_campaigns: 1000
  products_per_campaign: 5       # ~5k products total
  orders_per_product: 1          # ~5k orders total  (≈ 5 per campaign)
  events_per_campaign: 4         # ~4k events  total
  batch_size: 1000

# External-table fixtures (s3/file benchmarks: external_load, external_join,
# external_dump).  Written to data/fixtures/ by generate_external_fixtures.py.
# num_campaigns defaults to group_a so campaign_id space matches the backends;
# regions ⋈ web_events is the internal-join workload.
external:
  num_campaigns: 1000            # share campaign_id space with group_a
  regions_per_campaign: 4        # regions.parquet  -> ~4k rows
  events_per_campaign: 20        # web_events.csv   -> ~20k rows
  # regions ⋈ web_events on campaign_id -> 4 × 20 × num_campaigns = ~80k rows

# Kafka SOURCE-ingestion benchmark (kafka_ingest).  A JSON dataset is generated
# (data/generate_kafka_fixtures.py -> kafka_events.ndjson) and seeded into a
# Kafka topic at bring-up (compose_kafka.yml -> data/seed_kafka.py).  The bench
# then CREATE SOURCEs over that topic (OFFSET_RESET='earliest') and times how
# fast the poller ingests every row into the local kafka.<src> table.  Columns
# are primitive only — json_to_chunk supports INT/BIGINT/DOUBLE/STRING/BOOL.
# num_records is BOTH the produced count and the expected ingest count, so it is
# baked into the client image (change it -> --rebuild, like the other blocks).
kafka:
  num_records: 50000             # rows produced into the topic == expected ingest count
  topic: bench_events            # topic the seed job creates + fills
