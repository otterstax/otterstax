# Example server config — local mode (server runs as a local binary, backends
# addressed via host-published ports). Point the server at this file with:
#   ./build/server --config examples/simple/example_connetion/config_local.yaml

service:
  flight_sql:
    host: "0.0.0.0"
    port: 8815
  mysql:
    port: 8816
  postgres:
    port: 8817
  connection_retry:
    max_attempts: 10
    delay_ms: 2000

connections:
  mysql:
    - alias: campaigns
      host: 0.0.0.0
      port: "3101"
      username: user1
      password: password1
      database: db1
      table: ""
    - alias: impressions
      host: 0.0.0.0
      port: "3102"
      username: user2
      password: password2
      database: db2
      table: ""

  postgresql:
    - alias: products
      host: 0.0.0.0
      port: "3103"
      username: pguser
      password: pgpassword
      database: pgdb
      schema: public
      table: ""

  clickhouse:
    - alias: chtest
      host: localhost
      port: "3104"
      username: chuser
      password: chpassword
      database: chdb
      table: ""

  s3:
    - alias: s3
      access_key: minioadmin
      secret_key: minioadmin
      region: us-east-1
      endpoint: localhost:9000
