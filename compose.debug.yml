# This docker-compose file is used for debugging purposes. 
# It sets up multiple database instances (MariaDB and PostgreSQL) to allow 
# testing and development of the application in a controlled environment. 
# It doesnt include the application service, it runs separetly.
# It used debug network to avoid conflicts with the main compose file and allow simultaneous running of both environments.
services:

  mariadb1:
    image: mariadb:latest
    container_name: mariadb_instance1
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: db1
      MYSQL_USER: user1
      MYSQL_PASSWORD: password1
    ports:
      - "3101:3306"
    volumes:
      - ./init/mariadb1:/docker-entrypoint-initdb.d
      - ./mariadb1_data:/var/lib/mysql
    networks:
      - otterstax_app_network_debug
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mariadb-admin", "ping", "-h", "localhost", "-u", "user1", "-ppassword1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  mariadb2:
    image: mariadb:latest
    container_name: mariadb_instance2
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: db2
      MYSQL_USER: user2
      MYSQL_PASSWORD: password2
    ports:
      - "3102:3306"
    volumes:
      - ./init/mariadb2:/docker-entrypoint-initdb.d
      - ./mariadb2_data:/var/lib/mysql
    networks:
      - otterstax_app_network_debug
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mariadb-admin", "ping", "-h", "localhost", "-u", "user2", "-ppassword2"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  postgres1:
    image: postgres:15
    container_name: postgres_instance1
    environment:
      POSTGRES_USER: pguser
      POSTGRES_PASSWORD: pgpassword
      POSTGRES_DB: pgdb
    ports:
      - "3103:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pguser -d pgdb"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    volumes:
      - ./init/postgres:/docker-entrypoint-initdb.d
      - ./postgres_data:/var/lib/postgresql/data
    networks:
      - otterstax_app_network_debug
    restart: unless-stopped

  clickhouse1:
    image: clickhouse/clickhouse-server:23.8
    container_name: clickhouse_instance1
    environment:
      CLICKHOUSE_DB: chdb
      CLICKHOUSE_USER: chuser
      CLICKHOUSE_PASSWORD: chpassword
    ports:
      - "3104:9000"
      - "3105:8123"
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --query 'SELECT 1' --password chpassword"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    volumes:
      - ./init/clickhouse:/docker-entrypoint-initdb.d
      - ./clickhouse_data:/var/lib/clickhouse
    networks:
      - otterstax_app_network_debug
    restart: unless-stopped

  # RustFS (S3-compatible) for debugging the s3 external-table path locally. A
  # locally-run otterstax reaches it at localhost:9000; the seeded bucket is
  # test-bucket (people.parquet/csv/ndjson from tests/s3/fixtures).
  rustfs:
    image: rustfs/rustfs:latest
    container_name: rustfs_instance1
    environment:
      RUSTFS_ACCESS_KEY: rustfsadmin
      RUSTFS_SECRET_KEY: rustfsadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9000/health"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 5s
    volumes:
      - rustfs_data:/data
    networks:
      - otterstax_app_network_debug
    restart: unless-stopped

  rustfs-init:
    image: amazon/aws-cli:latest
    container_name: rustfs_instance1_init
    depends_on:
      rustfs:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: rustfsadmin
      AWS_SECRET_ACCESS_KEY: rustfsadmin
      AWS_DEFAULT_REGION: us-east-1
    volumes:
      - ./tests/s3/fixtures:/fixtures:ro
    entrypoint: >
      /bin/sh -c "
      E=http://rustfs:9000;
      aws --endpoint-url $$E s3api head-bucket --bucket test-bucket 2>/dev/null || aws --endpoint-url $$E s3 mb s3://test-bucket;
      aws --endpoint-url $$E s3api put-bucket-policy --bucket test-bucket --policy '{\"Version\":\"2012-10-17\",\"Statement\":[{\"Effect\":\"Allow\",\"Principal\":{\"AWS\":[\"*\"]},\"Action\":[\"s3:GetObject\"],\"Resource\":[\"arn:aws:s3:::test-bucket/*\"]}]}';
      aws --endpoint-url $$E s3 cp --recursive /fixtures/ s3://test-bucket/;
      echo 'rustfs ready: test-bucket seeded';
      "
    networks:
      - otterstax_app_network_debug

networks:
  otterstax_app_network_debug:
    external: true

volumes:
  mariadb1_data:
  mariadb2_data:
  postgres_data:
  clickhouse_data:
  rustfs_data:
