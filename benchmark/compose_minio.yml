# MinIO (S3-compatible) backend for the s3/file external-table benchmarks
# (external_load / external_join / external_dump).  Included on top of
# compose_backends.yml + compose_benchmark.yml only when an external_* test is
# selected (see run_benchmark.sh / manual/_common.sh).
#
# Mirrors the tests/minio setup, on the bench_net network.  The bucket is seeded
# from benchmark/data/fixtures, which is generated by
# data/generate_external_fixtures.py before the stack comes up.  bench-otterstax
# mounts the same directory at /fixtures (see compose_benchmark.yml) so the
# `file` source reads the identical fixtures the `s3` source serves.

services:
  bench_minio:
    image: minio/minio:latest
    container_name: bench_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    expose:
      - "9000"
      - "9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
    networks:
      - bench_net
    restart: unless-stopped

  # One-shot: create + seed bench-bucket from the generated fixtures, then exit.
  bench_minio_init:
    image: minio/mc:latest
    container_name: bench_minio_init
    depends_on:
      bench_minio:
        condition: service_healthy
    volumes:
      - ./data/fixtures:/fixtures:ro
    entrypoint: >
      /bin/sh -c "
      mc alias set m http://bench_minio:9000 minioadmin minioadmin;
      mc mb --ignore-existing m/bench-bucket;
      mc anonymous set download m/bench-bucket;
      mc cp --recursive /fixtures/ m/bench-bucket/;
      echo 'minio ready: bench-bucket seeded';
      "
    networks:
      - bench_net

networks:
  bench_net:
    name: bench_net
    external: true
