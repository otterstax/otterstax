services:
  mariadb1:
    image: mariadb:latest
    container_name: test-mariadb1
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: db1
      MYSQL_USER: user1
      MYSQL_PASSWORD: password1
    expose:
      - "3306"
    healthcheck:
      test: ["CMD", "mariadb-admin", "ping", "-h", "localhost", "-u", "user1", "-ppassword1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s
    volumes:
      - mariadb1_init:/docker-entrypoint-initdb.d    # Shared volume for init scripts
    networks:
      - test_app_network
    restart: unless-stopped

  mariadb2:
    image: mariadb:latest
    container_name: test-mariadb2
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: db2
      MYSQL_USER: user2
      MYSQL_PASSWORD: password2
    expose:
      - "3306"
    healthcheck:
      test: ["CMD", "mariadb-admin", "ping", "-h", "localhost", "-u", "user2", "-ppassword2"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s
    volumes:
      - mariadb2_init:/docker-entrypoint-initdb.d    # Shared volume for init scripts
    networks:
      - test_app_network
    restart: unless-stopped

  postgres1:
    image: postgres:15
    container_name: postgres1
    environment:
      POSTGRES_USER: pguser
      POSTGRES_PASSWORD: pgpassword
      POSTGRES_DB: pgdb
    expose:
      - "3307"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pguser -d pgdb"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s
    volumes:
      - postgres_init:/docker-entrypoint-initdb.d
    networks:
      - test_app_network
    restart: unless-stopped

  clickhouse1:
    image: clickhouse/clickhouse-server:23.8
    container_name: clickhouse1
    environment:
      CLICKHOUSE_DB: chdb
      CLICKHOUSE_USER: chuser
      CLICKHOUSE_PASSWORD: chpassword
    expose:
      - "9000"
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --query 'SELECT 1' --password chpassword"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s
    volumes:
      - clickhouse_init:/docker-entrypoint-initdb.d
    networks:
      - test_app_network
    restart: unless-stopped

  kafka:
    image: redpandadata/redpanda:v25.3.15
    container_name: test-kafka
    command:
      - redpanda
      - start
      - --mode=dev-container
      - --smp=1
      - --default-log-level=warn
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://kafka:9092,external://127.0.0.1:19092
    expose:
      - "9092"
    ports:
      - "19092:19092"
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true'"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s
    networks:
      - test_app_network
    restart: unless-stopped

  test-otterstax:
    image: otterstax_app:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile.test
      args:
        WITH_TRACY: ${WITH_TRACY:-false}
        BUILD_JOBS: ${BUILD_JOBS:-0}
    container_name: test_otterstax_app
    depends_on:
      mariadb1:
        condition: service_healthy
      mariadb2:
        condition: service_healthy
      postgres1:
        condition: service_healthy
      clickhouse1:
        condition: service_healthy
      rustfs:
        condition: service_healthy
      kafka:
        condition: service_healthy
    expose:
      - "8815"
      - "8816"
      - "8817"
      - "15002"
    ports:
      - "8086:8086"
    # Fixtures used by the file/s3 external-table tests are baked into the
    # Dockerfile.test image at /fixtures (see the COPY near the end of that
    # Dockerfile). Bind-mounting them from the host workspace breaks in DinD
    # CI runners where the docker daemon cannot see the runner's filesystem.
    # Connections are likewise baked into the image (tests/scripts/config.yaml
    # → config.yaml) and read once at startup.
    healthcheck:
      # No HTTP management port anymore — probe the FlightSQL wire port instead.
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/8815' || exit 1"]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 10s
    networks:
      test_app_network:
        aliases:
          - test-otterstax

  # RustFS (S3-compatible) backend for the s3 external-table tests. The MinIO
  # images are no longer pullable without authorization.
  rustfs:
    image: rustfs/rustfs:latest
    container_name: test-rustfs
    environment:
      RUSTFS_ACCESS_KEY: minioadmin
      RUSTFS_SECRET_KEY: minioadmin
    expose:
      - "9000"
      - "9001"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9000/health"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
    networks:
      - test_app_network
    restart: unless-stopped

  # One-shot job: create + seed test-bucket from the shared fixtures, then exit.
  # Fixtures are baked into the image (see tests/minio/Dockerfile.fixtures) so
  # the seeding works in DinD CI runners that cannot bind-mount the workspace.
  rustfs-init:
    build:
      context: .
      dockerfile: tests/minio/Dockerfile.fixtures
    container_name: test-rustfs-init
    depends_on:
      rustfs:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      AWS_DEFAULT_REGION: us-east-1
    entrypoint:
      - /bin/sh
      - -c
      - |
        aws --endpoint-url http://rustfs:9000 s3 mb s3://test-bucket
        aws --endpoint-url http://rustfs:9000 s3api put-bucket-policy --bucket test-bucket --policy '{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Principal":{"AWS":["*"]},"Action":["s3:GetObject"],"Resource":["arn:aws:s3:::test-bucket/*"]}]}'
        aws --endpoint-url http://rustfs:9000 s3 cp --recursive /fixtures/ s3://test-bucket/
        echo 'rustfs ready: test-bucket seeded'
    networks:
      - test_app_network

  test-client:
    build:
      context: .
      dockerfile: Dockerfile.integration-test
    container_name: test-client
    depends_on:
      mariadb1:
        condition: service_healthy
      mariadb2:
        condition: service_healthy
      postgres1:
        condition: service_healthy
      clickhouse1:
        condition: service_healthy
      kafka:
        condition: service_healthy
    volumes:
      - mariadb1_init:/app/mariadb1_init    # Mount SAME volumes as MariaDB
      - mariadb2_init:/app/mariadb2_init
      - postgres_init:/app/postgres_init
      - clickhouse_init:/app/clickhouse_init
      - ./tests/logs:/app/logs
    networks:
      - test_app_network
    dns_search: ""

  # PySpark client compatibility matrix (Dockerfile.spark-test): every released
  # PySpark Connect client against the Spark Connect frontend (port 15002), run
  # by docker-run-tests.sh after the standard suite. CI pre-builds the image
  # and passes its tag in SPARK_CLIENT_IMAGE.
  test-spark-client:
    image: ${SPARK_CLIENT_IMAGE:-otterstax_spark_client:latest}
    build:
      context: .
      dockerfile: Dockerfile.spark-test
    depends_on:
      mariadb1:
        condition: service_healthy
      mariadb2:
        condition: service_healthy
      postgres1:
        condition: service_healthy
      clickhouse1:
        condition: service_healthy
      kafka:
        condition: service_healthy
      test-otterstax:
        condition: service_healthy
    volumes:
      - ./tests/logs:/app/logs
    networks:
      - test_app_network
    dns_search: ""

networks:
  test_app_network:
    driver: bridge

volumes:
  mariadb1_init:    # Shared between test-client and mariadb1
  mariadb2_init:    # Shared between test-client and mariadb2
  postgres_init:    # Shared between test-client and postgres1
  clickhouse_init:  # Shared between test-client and clickhouse1
