version: '3.8'

services:

  mariadb1:
    image: mariadb:latest
    container_name: mariadb_instance1
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: db1
      MYSQL_USER: user1
      MYSQL_PASSWORD: password1
    ports:
      - "3101:3306"
    volumes:
      - ./init/mariadb1:/docker-entrypoint-initdb.d
      - ./mariadb1_data:/var/lib/mysql
    networks:
      - app_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mariadb-admin", "ping", "-h", "localhost", "-u", "user1", "-ppassword1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  mariadb2:
    image: mariadb:latest
    container_name: mariadb_instance2
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: db2
      MYSQL_USER: user2
      MYSQL_PASSWORD: password2
    ports:
      - "3102:3306"
    volumes:
      - ./init/mariadb2:/docker-entrypoint-initdb.d
      - ./mariadb2_data:/var/lib/mysql
    networks:
      - app_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mariadb-admin", "ping", "-h", "localhost", "-u", "user2", "-ppassword2"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  postgres1:
    image: postgres:15
    container_name: postgres_instance1
    environment:
      POSTGRES_USER: pguser
      POSTGRES_PASSWORD: pgpassword
      POSTGRES_DB: pgdb
    ports:
      - "3103:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pguser -d pgdb"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    volumes:
      - ./init/postgres:/docker-entrypoint-initdb.d
      - ./postgres_data:/var/lib/postgresql/data
    networks:
      - app_network
    restart: unless-stopped

  clickhouse1:
    image: clickhouse/clickhouse-server:23.8
    container_name: clickhouse_instance1
    environment:
      CLICKHOUSE_DB: chdb
      CLICKHOUSE_USER: chuser
      CLICKHOUSE_PASSWORD: chpassword
    ports:
      - "3104:9000"
    volumes:
      - ./init/clickhouse:/docker-entrypoint-initdb.d
      - clickhouse_data:/var/lib/clickhouse
    networks:
      - app_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --user chuser --password chpassword --query 'SELECT 1'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        WITH_TRACY: ${WITH_TRACY:-false}
    container_name: otterstax_app
    depends_on:
      - mariadb1
      - mariadb2
      - postgres1
      - clickhouse1
    ports:
      # 8815 FlightSQL / 8816 MySQL wire / 8086 Tracy. Connections are read from
      # the connection config file at startup (there is no HTTP management port).
      - "0.0.0.0:8815:8815"
      - "0.0.0.0:8816:8816"
      - "0.0.0.0:8086:8086"
    volumes:
      - ./app_data:/app/data
      # Single config file (server settings + connections, docker-DNS hostnames).
      # Mounted onto the server's default config path (config.yaml, relative to
      # WORKDIR /app/build/Release).
      - ./scripts/database/config.yaml:/app/build/Release/config.yaml:ro
    networks:
      - app_network

networks:
  app_network:
    driver: bridge

volumes:
  mariadb1_data:
  mariadb2_data:
  postgres_data:
  clickhouse_data:
