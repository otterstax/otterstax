name: Docker image

# The public server image (Dockerfile, target `runtime`):
#   ghcr.io/otterstax/otterstax:<version>
# Pushed for a version tag (v0.2.0 -> 0.2.0) or a manual run that names a
# version. A pull request touching the image only builds it.
on:
  push:
    tags: ["v*"]
  pull_request:
    branches: [main]
    paths:
      - Dockerfile
      - Dockerfile.deps
      - conanfile.py
      - .github/workflows/docker-publish.yml
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish, without the v (empty: build only)"
        required: false
        default: ""

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="${INPUT_VERSION}"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          if [ -n "${version}" ]; then echo "push=true" >> "$GITHUB_OUTPUT"; else echo "push=false" >> "$GITHUB_OUTPUT"; fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Also logs in to ghcr.io, which the push below needs.
      - name: Dependency image
        id: deps
        uses: ./.github/actions/deps-image
        with:
          variant: release
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          target: runtime
          platforms: linux/amd64
          push: ${{ steps.version.outputs.push == 'true' }}
          # 0 = min(nproc, MemTotal_MB / 1536), CLAUDE.md "Build resources".
          build-args: |
            DEPS_IMAGE=${{ steps.deps.outputs.image }}
            BUILD_JOBS=0
          tags: ghcr.io/otterstax/otterstax:${{ steps.version.outputs.version || 'build' }}
          cache-from: type=gha,scope=image
          cache-to: type=gha,mode=max,scope=image
