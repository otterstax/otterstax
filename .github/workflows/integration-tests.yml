name: Integration Tests

on:
  push:
    branches: [main, asan-tsan]
  pull_request:
    branches: [main]

jobs:
  integration-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build test image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.test
          push: false
          load: true
          tags: otterstax_app:ci-${{ github.sha }}
          cache-from: type=gha,scope=release
          cache-to: type=gha,mode=max,scope=release

      - name: Build Spark client matrix image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.spark-test
          push: false
          load: true
          tags: otterstax_spark_client:ci-${{ github.sha }}
          cache-from: type=gha,scope=spark-client
          cache-to: type=gha,mode=max,scope=spark-client

      - name: Run integration tests
        env:
          IMAGE_TAG: ci-${{ github.sha }}
          SPARK_CLIENT_IMAGE: otterstax_spark_client:ci-${{ github.sha }}
        run: ./docker-run-tests.sh
