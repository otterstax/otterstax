# Demo-only compose. Runs on separate ports (3201-3205, 8085/8815-8817) so
# it can coexist with the main compose.yml / compose.test.yml if anything's
# running.
#
# Two modes:
#
#   docker compose -f examples/demo/compose.yml up -d
#       → only backends (MariaDB/Postgres/ClickHouse)
#         for iterating locally with `./build/server` (see up.sh --local)
#
#   docker compose -f examples/demo/compose.yml --profile full up -d
#       → backends + demo-otterstax (one command end-to-end)
#
# Init SQL must exist before `up` — generated by:
#   python examples/demo/generate_data.py
#
# On teardown, always `down --volumes` — ClickHouse init scripts re-run only
# on a clean volume, and a dirty restart leaves stale schemas.

services:

  demo-mariadb:
    image: mariadb:latest
    container_name: demo-mariadb
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: bill
      MYSQL_USER: demo
      MYSQL_PASSWORD: demo
    ports:
      - "3201:3306"
    volumes:
      - ./init/mariadb:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mariadb-admin", "ping", "-h", "localhost", "-u", "demo", "-pdemo"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - demo_net

  demo-postgres:
    image: postgres:15
    container_name: demo-postgres
    environment:
      POSTGRES_USER: demo
      POSTGRES_PASSWORD: demo
      POSTGRES_DB: postgres     # init.sql does `CREATE DATABASE shop; \c shop`
    ports:
      - "3202:5432"
    volumes:
      - ./init/postgres:/docker-entrypoint-initdb.d
    healthcheck:
      # pg_isready against 'shop' so we know init.sql has finished.
      test: ["CMD-SHELL", "pg_isready -U demo -d shop"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s
    networks:
      - demo_net

  demo-clickhouse:
    image: clickhouse/clickhouse-server:23.8
    container_name: demo-clickhouse
    environment:
      CLICKHOUSE_DB: ev
      CLICKHOUSE_USER: demo
      CLICKHOUSE_PASSWORD: demo
      # clickhouse-server refuses default user with a password set unless this
      # is flipped — needed when a plain 'default' connects to add a session.
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ports:
      - "3204:9000"    # native TCP
      - "3205:8123"    # HTTP
    volumes:
      - ./init/clickhouse:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --user demo --password demo --query 'SELECT count() FROM ev.sessions' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s
    networks:
      - demo_net

  # S3-compatible object store used by steps 7-9. Single bucket seeded with
  # the fixtures `examples/demo/generate_data.py` writes into `init/s3/`.
  demo-minio:
    image: minio/minio:latest
    container_name: demo-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "3206:9000"   # S3 API
      - "3207:9001"   # console
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 5s
    networks:
      - demo_net

  # Kafka broker (redpanda) for the streaming demo (examples/demo/kafka/).
  # The external listener is advertised as 127.0.0.1:19093 so a host-side
  # seed/consume client — and a `--local` otterstax binary — can reach it; the
  # in-network otterstax uses the internal listener demo-kafka:9092. Port 19093
  # (not the test stack's 19092) keeps this coexisting with compose.test.yml.
  demo-kafka:
    image: redpandadata/redpanda:v25.3.15
    container_name: demo-kafka
    command:
      - redpanda
      - start
      - --mode=dev-container
      - --smp=1
      - --default-log-level=warn
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19093
      - --advertise-kafka-addr=internal://demo-kafka:9092,external://127.0.0.1:19093
    ports:
      - "19093:19093"
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true'"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 20s
    networks:
      - demo_net

  # One-shot init: create the bucket and upload the demo fixtures, then exit.
  demo-minio-init:
    image: minio/mc:latest
    container_name: demo-minio-init
    depends_on:
      demo-minio:
        condition: service_healthy
    volumes:
      - ./init/s3:/fixtures:ro
    entrypoint: >
      sh -c "
        mc alias set m http://demo-minio:9000 minioadmin minioadmin &&
        mc mb --ignore-existing m/demo-bucket &&
        if [ -d /fixtures ]; then mc cp --recursive /fixtures/ m/demo-bucket/; fi &&
        echo 'demo-bucket seeded.';
      "
    networks:
      - demo_net

  # Optional — brought up only with `--profile full`.
  demo-otterstax:
    build:
      context: ../..
      dockerfile: Dockerfile
    image: otterstax_app:latest
    container_name: demo-otterstax
    profiles: ["full"]
    depends_on:
      demo-mariadb:
        condition: service_healthy
      demo-postgres:
        condition: service_healthy
      demo-clickhouse:
        condition: service_healthy
      demo-minio:
        condition: service_healthy
      demo-kafka:
        condition: service_healthy
    ports:
      - "8085:8085"    # HTTP connection-manager
      - "8815:8815"    # FlightSQL
      - "8816:8816"    # MySQL wire
      - "8817:8817"    # PostgreSQL wire
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8085/health"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    networks:
      - demo_net

networks:
  demo_net:
    driver: bridge
