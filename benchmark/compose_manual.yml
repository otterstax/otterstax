# Compose overlay used by benchmark/manual/ scripts.
# Publishes all OtterStax wire-protocol ports to the host so that:
#   • Tracy GUI can connect directly on localhost:8086
#   • MySQL clients can connect on localhost:8816
#   • PostgreSQL clients can connect on localhost:8817
#   • Arrow/FlightSQL clients can connect on localhost:8815
#   • HTTP connection API is reachable on localhost:8085
#
# Usage (applied on top of compose_benchmark.yml):
#   docker compose -f compose_benchmark.yml -f compose_manual.yml -p bench up -d bench-otterstax

services:
  bench-otterstax:
    ports:
      - "8085:8085"
      - "8815:8815"
      - "8816:8816"
      - "8817:8817"
