# RustFS (S3-compatible) backend for the s3/file external-table benchmarks
# (external_load / external_join / external_dump).  Included on top of
# compose_backends.yml + compose_benchmark.yml only when an external_* test is
# selected (see run_benchmark.sh / manual/_common.sh).
#
# Mirrors the tests/s3 setup, on the bench_net network.  The bucket is seeded
# from benchmark/data/fixtures, which is generated by
# data/generate_external_fixtures.py before the stack comes up.  bench-otterstax
# mounts the same directory at /fixtures (see compose_benchmark.yml) so the
# `file` source reads the identical fixtures the `s3` source serves.

services:
  bench_rustfs:
    image: rustfs/rustfs:latest
    container_name: bench_rustfs
    environment:
      RUSTFS_ACCESS_KEY: rustfsadmin
      RUSTFS_SECRET_KEY: rustfsadmin
    expose:
      - "9000"
      - "9001"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9000/health"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
    networks:
      - bench_net
    restart: unless-stopped

  # One-shot: create + seed bench-bucket from the generated fixtures, then exit.
  bench_rustfs_init:
    image: amazon/aws-cli:latest
    container_name: bench_rustfs_init
    depends_on:
      bench_rustfs:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: rustfsadmin
      AWS_SECRET_ACCESS_KEY: rustfsadmin
      AWS_DEFAULT_REGION: us-east-1
    volumes:
      - ./data/fixtures:/fixtures:ro
    entrypoint: >
      /bin/sh -c "
      E=http://bench_rustfs:9000;
      aws --endpoint-url $$E s3api head-bucket --bucket bench-bucket 2>/dev/null || aws --endpoint-url $$E s3 mb s3://bench-bucket;
      aws --endpoint-url $$E s3api put-bucket-policy --bucket bench-bucket --policy '{\"Version\":\"2012-10-17\",\"Statement\":[{\"Effect\":\"Allow\",\"Principal\":{\"AWS\":[\"*\"]},\"Action\":[\"s3:GetObject\"],\"Resource\":[\"arn:aws:s3:::bench-bucket/*\"]}]}';
      aws --endpoint-url $$E s3 cp --recursive /fixtures/ s3://bench-bucket/;
      echo 'rustfs ready: bench-bucket seeded';
      "
    networks:
      - bench_net

networks:
  bench_net:
    name: bench_net
    external: true
