services:
  mariadb1:
    image: mariadb:latest
    container_name: test-mariadb1
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: db1
      MYSQL_USER: user1
      MYSQL_PASSWORD: password1
    expose:
      - "3306"
    healthcheck:
      test: ["CMD", "mariadb-admin", "ping", "-h", "localhost", "-u", "user1", "-ppassword1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s
    volumes:
      - mariadb1_init:/docker-entrypoint-initdb.d    # Shared volume for init scripts
    networks:
      - test_app_network
    restart: unless-stopped

  mariadb2:
    image: mariadb:latest
    container_name: test-mariadb2
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: db2
      MYSQL_USER: user2
      MYSQL_PASSWORD: password2
    expose:
      - "3306"
    healthcheck:
      test: ["CMD", "mariadb-admin", "ping", "-h", "localhost", "-u", "user2", "-ppassword2"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s
    volumes:
      - mariadb2_init:/docker-entrypoint-initdb.d    # Shared volume for init scripts
    networks:
      - test_app_network
    restart: unless-stopped

  postgres1:
    image: postgres:15
    container_name: postgres1
    environment:
      POSTGRES_USER: pguser
      POSTGRES_PASSWORD: pgpassword
      POSTGRES_DB: pgdb
    expose:
      - "3307"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pguser -d pgdb"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s
    volumes:
      - postgres_init:/docker-entrypoint-initdb.d
    networks:
      - test_app_network
    restart: unless-stopped

  clickhouse1:
    image: clickhouse/clickhouse-server:23.8
    container_name: clickhouse1
    environment:
      CLICKHOUSE_DB: chdb
      CLICKHOUSE_USER: chuser
      CLICKHOUSE_PASSWORD: chpassword
    expose:
      - "9000"
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --query 'SELECT 1' --password chpassword"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s
    volumes:
      - clickhouse_init:/docker-entrypoint-initdb.d
    networks:
      - test_app_network
    restart: unless-stopped

  test-otterstax:
    image: otterstax_app:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile.test
      args:
        WITH_TRACY: ${WITH_TRACY:-false}
        BUILD_JOBS: ${BUILD_JOBS:-0}
    container_name: test_otterstax_app
    depends_on:
      mariadb1:
        condition: service_healthy
      mariadb2:
        condition: service_healthy
      postgres1:
        condition: service_healthy
      clickhouse1:
        condition: service_healthy
      minio:
        condition: service_healthy
    expose:
      - "8815"
      - "8085"
      - "15002"
    ports:
      - "8086:8086"
    # Fixtures used by the file/s3 external-table tests are baked into the
    # Dockerfile.test image at /fixtures (see the COPY near the end of that
    # Dockerfile). Bind-mounting them from the host workspace breaks in DinD
    # CI runners where the docker daemon cannot see the runner's filesystem.
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8085/health"]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 10s
    networks:
      test_app_network:
        aliases:
          - test-otterstax

  # MinIO (S3-compatible) backend for the s3 external-table tests. Mirrors the
  # standalone stack in tests/minio/docker-compose.yml, on the test network.
  minio:
    image: minio/minio:latest
    container_name: test-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    expose:
      - "9000"
      - "9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
    networks:
      - test_app_network
    restart: unless-stopped

  # One-shot job: create + seed test-bucket from the shared fixtures, then exit.
  # Fixtures are baked into the image (see tests/minio/Dockerfile.fixtures) so
  # the seeding works in DinD CI runners that cannot bind-mount the workspace.
  minio-init:
    build:
      context: .
      dockerfile: tests/minio/Dockerfile.fixtures
    container_name: test-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set m http://minio:9000 minioadmin minioadmin;
      mc mb --ignore-existing m/test-bucket;
      mc anonymous set download m/test-bucket;
      mc cp --recursive /fixtures/ m/test-bucket/;
      echo 'minio ready: test-bucket seeded';
      "
    networks:
      - test_app_network

  test-client:
    build:
      context: .
      dockerfile: Dockerfile.integration-test
    container_name: test-client
    depends_on:
      mariadb1:
        condition: service_healthy
      mariadb2:
        condition: service_healthy
      postgres1:
        condition: service_healthy
      clickhouse1:
        condition: service_healthy
    volumes:
      - mariadb1_init:/app/mariadb1_init    # Mount SAME volumes as MariaDB
      - mariadb2_init:/app/mariadb2_init
      - postgres_init:/app/postgres_init
      - clickhouse_init:/app/clickhouse_init
      - ./tests/logs:/app/logs
    networks:
      - test_app_network
    dns_search: ""

  # Spark Connect E2E test client. Identical to test-client but builds from
  # Dockerfile.spark-test, which layers OpenJDK 17 + pyspark on top of the
  # python:3.12-slim base so the test_spark_client_*.py scripts can run.
  # Shares test_app_network and reaches the Spark Connect server at
  # test-otterstax:15002.
  test-spark-client:
    build:
      context: .
      dockerfile: Dockerfile.spark-test
    container_name: test-spark-client
    depends_on:
      test-otterstax:
        condition: service_healthy
      mariadb1:
        condition: service_healthy
      mariadb2:
        condition: service_healthy
      postgres1:
        condition: service_healthy
      clickhouse1:
        condition: service_healthy
    volumes:
      - mariadb1_init:/app/mariadb1_init
      - mariadb2_init:/app/mariadb2_init
      - postgres_init:/app/postgres_init
      - clickhouse_init:/app/clickhouse_init
      - ./tests/logs:/app/logs
    networks:
      - test_app_network
    dns_search: ""

networks:
  test_app_network:
    driver: bridge

volumes:
  mariadb1_init:    # Shared between test-client and mariadb1
  mariadb2_init:    # Shared between test-client and mariadb2
  postgres_init:    # Shared between test-client and postgres1
  clickhouse_init:  # Shared between test-client and clickhouse1
