name: Unit Tests

on:
  push:
    branches: [main, postgresql]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Documentation references
        run: python3 scripts/tools/doc_refs_check.py .

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Dependency image
        id: deps
        uses: ./.github/actions/deps-image
        with:
          variant: release
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and run unit tests
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.test
          push: false
          load: false
          tags: otterstax-test
          # Build-only coverage for benchmark/microbench: the benchmark binary is
          # compiled and linked alongside the tests but never run here.
          build-args: |
            DEPS_IMAGE=${{ steps.deps.outputs.image }}
            BUILD_BENCHMARKS=ON
          cache-from: type=gha,scope=release
          cache-to: type=gha,mode=max,scope=release
