name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - dev
      - 'ci/**'
  pull_request:
    branches:
      - main
      - dev

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Install Docker CLI
        run: |
          apt-get update
          apt-get install -y ca-certificates curl
          install -m 0755 -d /etc/apt/keyrings
          curl -fsSL https://download.docker.com/linux/debian/gpg -o /etc/apt/keyrings/docker.asc
          chmod a+r /etc/apt/keyrings/docker.asc
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/debian $(. /etc/os-release && echo "$VERSION_CODENAME") stable" | tee /etc/apt/sources.list.d/docker.list > /dev/null
          apt-get update
          apt-get install -y docker-ce-cli docker-compose-plugin

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Verify Docker is working
        run: |
          docker --version
          docker compose version

      - name: Cleanup previous test runs
        run: |
          echo "=== Checking running containers ==="
          docker ps -a
          echo "=== Checking ports in use ==="
          netstat -tlnp 2>/dev/null | grep -E ':(8085|8815|3101|3102)' || echo "No processes found on test ports"
          # Stop and remove containers by name
          docker stop test-mariadb1 test-mariadb2 test_otterstax_app test-client 2>/dev/null || true
          docker rm -f test-mariadb1 test-mariadb2 test_otterstax_app test-client 2>/dev/null || true
          # Cleanup via compose
          docker compose -f compose.test.yml down -v --remove-orphans 2>/dev/null || true
          # Remove any dangling resources
          docker system prune -af --volumes || true
          # Wait for ports to be released
          sleep 5
          echo "=== After cleanup - checking containers ==="
          docker ps -a
          echo "=== After cleanup - checking ports ==="
          netstat -tlnp 2>/dev/null | grep -E ':(8085|8815|3101|3102)' || echo "Ports are free"

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: otterstax_app:${{ github.sha }},otterstax_app:latest
          load: true

      - name: Start test services
        run: |
          docker compose -f compose.test.yml up -d --build

      - name: Wait for databases to be ready
        run: |
          echo "Waiting for MariaDB instances to be ready..."
          timeout 120 bash -c 'until docker compose -f compose.test.yml ps | grep -q "healthy"; do sleep 5; done' || true
          sleep 10

      - name: Wait for tests to complete
        run: |
          echo "Waiting for test-client to finish..."
          docker compose -f compose.test.yml logs -f test-client &
          timeout 300 bash -c 'until [ "$(docker inspect -f {{.State.Status}} test-client 2>/dev/null)" = "exited" ]; do sleep 5; done' || true

      - name: Check test results
        run: |
          EXIT_CODE=$(docker inspect -f '{{.State.ExitCode}}' test-client 2>/dev/null || echo "1")
          if [ "$EXIT_CODE" != "0" ]; then
            echo "Tests failed with exit code: $EXIT_CODE"
            exit 1
          fi
          echo "Tests passed successfully"

      - name: Show logs
        if: always()
        run: |
          echo "=== MariaDB1 logs ==="
          docker compose -f compose.test.yml logs mariadb1
          echo "=== MariaDB2 logs ==="
          docker compose -f compose.test.yml logs mariadb2
          echo "=== Test Otterstax logs ==="
          docker compose -f compose.test.yml logs test-otterstax
          echo "=== Test Client logs ==="
          docker compose -f compose.test.yml logs test-client

      - name: Stop services
        if: always()
        run: |
          docker compose -f compose.test.yml down -v --remove-orphans
          docker system prune -f || true