# Integration-test server config. Baked into the test-otterstax image (see
# Dockerfile.test) at the server's default config path and read once at startup.
# Backends are addressed by docker-DNS names on the test network. Aliases here
# must match the Python suite (tests/*.py, config.py, external_helpers.py).

service:
  flight_sql:
    host: "0.0.0.0"
    port: 8815
  mysql:
    port: 8816
  postgres:
    port: 8817
  connection_retry:
    max_attempts: 10
    delay_ms: 2000

connections:
  mysql:
    - alias: campaigns
      host: mariadb1
      port: "3306"
      username: user1
      password: password1
      database: db1
      table: ""
    - alias: impressions
      host: mariadb2
      port: "3306"
      username: user2
      password: password2
      database: db2
      table: ""

  postgresql:
    - alias: products
      host: postgres1
      port: "5432"
      username: pguser
      password: pgpassword
      database: pgdb
      schema: public
      table: ""

  clickhouse:
    - alias: chtest
      host: clickhouse1
      port: "9000"
      username: chuser
      password: chpassword
      database: chdb
      table: orders

  s3:
    - alias: miniotest
      access_key: minioadmin
      secret_key: minioadmin
      region: us-east-1
      endpoint: minio:9000
